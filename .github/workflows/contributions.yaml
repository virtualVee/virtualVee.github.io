name: Check open source contributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check contributions and write run summary
        run: npm run contributions:check
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: contribution-review
          path: output/contributions/review-*.json
          retention-days: 14
          if-no-files-found: error
